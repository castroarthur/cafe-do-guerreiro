<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Prato com pao de queijo</title>
  <desc id="desc">Ilustracao generica de um prato com paes de queijo dourados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7efe3"/>
      <stop offset="100%" stop-color="#e8d5bb"/>
    </linearGradient>
    <radialGradient id="roll" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe2a8"/>
      <stop offset="65%" stop-color="#e4a857"/>
      <stop offset="100%" stop-color="#b9762e"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="720" rx="360" ry="70" fill="#000000" opacity="0.12"/>

  <g filter="url(#shadow)">
    <ellipse cx="600" cy="530" rx="390" ry="240" fill="url(#plate)"/>
    <ellipse cx="600" cy="530" rx="335" ry="195" fill="#f9f9f9"/>
  </g>

  <g>
    <circle cx="470" cy="450" r="78" fill="url(#roll)"/>
    <circle cx="585" cy="430" r="82" fill="url(#roll)"/>
    <circle cx="705" cy="458" r="80" fill="url(#roll)"/>
    <circle cx="525" cy="555" r="84" fill="url(#roll)"/>
    <circle cx="645" cy="575" r="86" fill="url(#roll)"/>
    <circle cx="760" cy="545" r="76" fill="url(#roll)"/>
    <circle cx="405" cy="545" r="70" fill="url(#roll)"/>
  </g>

  <g fill="#fff6db" opacity="0.55">
    <circle cx="445" cy="420" r="18"/>
    <circle cx="560" cy="398" r="16"/>
    <circle cx="678" cy="430" r="17"/>
    <circle cx="500" cy="520" r="19"/>
    <circle cx="625" cy="540" r="20"/>
  </g>
</svg>
